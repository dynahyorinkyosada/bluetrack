<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BlueTrack</title>
<style>
body{font-family:sans-serif;background:#F8FAFC;margin:0;padding:20px;color:#1E293B}
.card{background:#fff;padding:24px;border-radius:14px;max-width:400px;margin:0 auto;box-shadow:0 4px 12px rgba(0,0,0,.08)}
h1{color:#2563EB;font-size:22px;text-align:center;margin:0 0 4px}
.sub{text-align:center;color:#64748B;font-size:13px;margin-bottom:20px}
input,button{width:100%;padding:12px;margin:8px 0;border:1.5px solid #E2E8F0;border-radius:10px;font-size:15px;box-sizing:border-box}
input:focus{outline:none;border-color:#2563EB}
button{background:#2563EB;color:#fff;font-weight:600;border:none;cursor:pointer;min-height:46px}
button:disabled{opacity:.5}
#err{background:#FEF2F2;color:#B91C1C;padding:10px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none}
#err.show{display:block}
#dbg{background:#000;color:#0f0;font-family:monospace;font-size:11px;padding:8px;border-radius:6px;margin-top:12px;white-space:pre-wrap;min-height:20px;max-height:200px;overflow:auto}
#main{display:none}
</style>
</head>
<body>

<div id="login-screen">
  <div class="card">
    <h1>BlueTrack</h1>
    <p class="sub">Login Administrator</p>
    <div id="err"></div>
    <form id="lf">
      <input type="email" id="le" placeholder="Email" required autocomplete="email"/>
      <input type="password" id="lp" placeholder="Password" required autocomplete="current-password"/>
      <button type="submit" id="lbtn">Masuk</button>
    </form>
    <div id="dbg">Menunggu...</div>
  </div>
</div>

<div id="main">
  <div class="card">
    <h1>Selamat datang</h1>
    <p class="sub" id="who"></p>
    <button onclick="logout()" style="background:#EF4444">Keluar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0"></script>
<script>
const SUPABASE_URL = 'https://dggsarhrtmthlxyuwptu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnZ3NhcmhydG10aGx4eXV3cHR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4ODA5NzIsImV4cCI6MjEwOTQ1Njk3Mn0.eYmsnumUKXvR38x4AFM0xdxi5hv9pfMtyDZinliYJSc';

const $ = id => document.getElementById(id);
const dbg = $('dbg');
function log(m) { dbg.textContent += '\n' + m; }

log('Script mulai');

let sb;
try {
  log('Init client...');
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  log('Client OK');
} catch (e) {
  log('GAGAL createClient: ' + e.message);
}

$('lf').addEventListener('submit', async (e) => {
  e.preventDefault();
  log('--- Submit ---');
  $('err').classList.remove('show');
  const email = $('le').value.trim();
  const password = $('lp').value;
  log('Email: ' + email);
  log('Password len: ' + password.length);
  
  $('lbtn').disabled = true;
  $('lbtn').textContent = 'Memproses...';
  log('Memanggil Supabase...');
  
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    log('Respons diterima');
    if (error) {
      log('ERROR: ' + error.message);
      throw error;
    }
    log('SUKSES: ' + data.user.email);
    $('who').textContent = data.user.email;
    $('login-screen').style.display = 'none';
    $('main').style.display = 'block';
  } catch (err) {
    log('CATCH: ' + err.message);
    $('err').textContent = err.message || 'Login gagal';
    $('err').classList.add('show');
  } finally {
    $('lbtn').disabled = false;
    $('lbtn').textContent = 'Masuk';
  }
});

async function logout() {
  await sb.auth.signOut();
  $('login-screen').style.display = 'block';
  $('main').style.display = 'none';
  log('Logout');
}
</script>
</body>
</html>
